<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Звіт фотографа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #8b8b8b);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --section: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --danger: #e53935;
    --ok: #2e9e6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 16px 120px;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--hint); font-size: 14px; margin-bottom: 16px; }
  .periodLine {
    background: var(--section); border-radius: 10px; padding: 10px 14px;
    font-size: 15px; font-weight: 600; margin-bottom: 16px; text-align: center;
  }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .tip { color: var(--hint); font-size: 13px; font-weight: 400; margin-top: 2px; }
  .per { color: var(--ok); font-weight: 600; }
  input, textarea {
    width: 100%; padding: 12px 14px; font-size: 17px; font-family: inherit;
    color: var(--text); background: var(--section);
    border: 2px solid transparent; border-radius: 10px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--btn); }
  input.bad, textarea.bad { border-color: var(--danger); }
  textarea { min-height: 76px; resize: vertical; }
  .err { color: var(--danger); font-size: 13px; margin-top: 6px; display: none; }
  .err.on { display: block; }
  .notice {
    background: var(--section); border-radius: 10px; padding: 12px 14px;
    font-size: 14px; color: var(--hint); margin-bottom: 16px;
  }
  .notice.warn { color: var(--danger); }
  .divider { height: 1px; background: var(--section); margin: 22px 0 18px; }
  .divider-label {
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--hint); margin: 22px 0 12px;
  }
  .total {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--bg); border-top: 1px solid var(--section);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    font-size: 15px;
  }
  .total .row { display: flex; justify-content: space-between; align-items: baseline; }
  .total .big { font-size: 22px; font-weight: 700; }
  .total .hintline { color: var(--hint); font-size: 12px; margin-top: 2px; }
  .center { text-align: center; padding: 56px 20px; color: var(--hint); }
  .big-emoji { font-size: 44px; margin-bottom: 12px; }
  .name-list button {
    display: block; width: 100%; text-align: left; margin-bottom: 8px;
    padding: 14px; font-size: 17px; font-family: inherit;
    color: var(--text); background: var(--section);
    border: 2px solid transparent; border-radius: 10px; cursor: pointer;
  }
  #pickSearch { margin-bottom: 14px; }
  .fallback {
    width: 100%; padding: 15px; margin-top: 8px; font-size: 17px; font-weight: 600;
    font-family: inherit; color: var(--btn-text); background: var(--btn);
    border: none; border-radius: 10px; cursor: pointer;
  }
  .breakdown { text-align: left; font-size: 14px; line-height: 1.7; margin-top: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="loading" class="center"><div class="big-emoji">⏳</div>Завантаження…</div>

<div id="fatal" class="center hidden">
  <div class="big-emoji">⚠️</div>
  <div id="fatalText"></div>
</div>

<div id="pick" class="hidden">
  <h1>Хто ти?</h1>
  <div class="sub">Обери своє імʼя один раз — далі бот тебе впізнаватиме сам.</div>
  <input id="pickSearch" type="text" placeholder="Почни вводити прізвище…" autocomplete="off">
  <div id="pickList" class="name-list"></div>
  <div id="pickEmpty" class="notice hidden">
    Твого імені немає у списку вільних. Можливо, ти вже обрав себе раніше
    з іншого акаунта. Звернись до керівника.
  </div>
</div>

<div id="form" class="hidden">
  <h1>Місячний звіт</h1>
  <div class="sub" id="who"></div>
  <div class="periodLine" id="periodLine"></div>
  <div id="editNotice" class="notice hidden"></div>
  <div id="rateNotice" class="notice warn hidden"></div>

  <div id="metrics"></div>

  <div class="divider-label">Витрати</div>

  <div class="field">
    <label>Витрати на транспорт, грн<div class="tip">Напр. 1450 або 1450.50</div></label>
    <input id="transport" type="text" inputmode="decimal" placeholder="0">
    <div class="err" id="err_transport"></div>
  </div>

  <div class="field">
    <label>Якщо були інші витрати — вкажи суму, грн<div class="tip">Якщо не було — 0</div></label>
    <input id="other" type="text" inputmode="decimal" placeholder="0">
    <div class="err" id="err_other"></div>
  </div>

  <div class="field hidden" id="commentField">
    <label>На що були інші витрати<div class="tip">Коротко, кілька слів</div></label>
    <textarea id="comment" placeholder="Напр. корм"></textarea>
    <div class="err" id="err_comment"></div>
  </div>

  <button id="fallbackSubmit" class="fallback hidden">Надіслати звіт</button>
</div>

<div id="totalBar" class="total hidden">
  <div class="row">
    <span>Разом до виплати</span>
    <span class="big" id="totalValue">0 грн</span>
  </div>
  <div class="hintline" id="totalHint"></div>
</div>

<div id="done" class="center hidden">
  <div class="big-emoji">✅</div>
  <div id="doneText"></div>
  <div class="breakdown" id="doneBreakdown"></div>
</div>

<script>
(function () {
  'use strict';

  // ⚠️ Встав сюди URL веб-апки Apps Script (закінчується на /exec)
  var API = 'https://script.google.com/macros/s/AKfycbxEknWI_qIV0jROjU8lL_6IiFdH6ejn_3Ae8PGbNY-HkE7fa2-GchtEKWmYpphss12q/exec';

  var tg = window.Telegram && window.Telegram.WebApp;
  var state = { fields: [], roundUpTo: 0, noRate: false };

  var $ = function (id) { return document.getElementById(id); };
  var show = function (id) { $(id).classList.remove('hidden'); };
  var hide = function (id) { $(id).classList.add('hidden'); };
  var money = function (v) {
    var n = Math.round((Number(v) || 0) * 100) / 100;
    return (n % 1 === 0 ? String(n) : n.toFixed(2));
  };

  if (!tg || !tg.initData) {
    hide('loading'); show('fatal');
    $('fatalText').textContent = 'Цю форму треба відкривати з Telegram — через кнопку в робочому чаті.';
    return;
  }
  tg.ready();
  tg.expand();

  function api(action, extra, cb) {
    var body = { __miniapp: 1, action: action, initData: tg.initData };
    for (var k in extra) if (extra.hasOwnProperty(k)) body[k] = extra[k];

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    })
      .then(function (r) { return r.json(); })
      .then(cb)
      .catch(function () {
        hide('loading'); show('fatal');
        $('fatalText').textContent = 'Немає звʼязку з сервером. Перевір інтернет і спробуй ще раз.';
      });
  }

  api('init', {}, function (res) {
    hide('loading');
    if (!res || !res.ok) {
      show('fatal');
      $('fatalText').textContent = (res && res.message) || 'Не вдалося завантажити форму.';
      return;
    }
    if (!res.bound) { renderPick(res.candidates || []); return; }
    startForm(res);
  });

  /* ────────────────────── вибір себе зі списку ────────────────────── */

  function renderPick(list) {
    show('pick');
    if (!list.length) { hide('pickSearch'); show('pickEmpty'); return; }

    var box = $('pickList');
    $('pickSearch').addEventListener('input', function () {
      var q = this.value.trim().toLowerCase();
      for (var i = 0; i < box.children.length; i++) {
        var el = box.children[i];
        el.style.display = (!q || el.textContent.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
      }
    });

    list.forEach(function (p) {
      var b = document.createElement('button');
      b.appendChild(document.createTextNode(p.name));
      b.onclick = function () {
        b.disabled = true;
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        api('bind', { userId: p.userId }, function (r) {
          if (!r || !r.ok) {
            b.disabled = false;
            tg.showAlert((r && r.message) || 'Не вдалося привʼязати.');
            return;
          }
          hide('pick'); show('loading');
          api('init', {}, function (r2) {
            hide('loading');
            if (r2 && r2.ok && r2.bound) startForm(r2);
            else { show('fatal'); $('fatalText').textContent = 'Привʼязано, але форма не завантажилась. Відкрий заново.'; }
          });
        });
      };
      box.appendChild(b);
    });
  }

  /* ──────────────────────────── форма ──────────────────────────── */

  function startForm(res) {
    show('form');
    show('totalBar');
    $('who').textContent = res.name;
    $('periodLine').textContent = 'Звіт за ' + res.period.label;
    state.fields = res.fields || [];
    state.roundUpTo = res.roundUpTo || 0;
    state.noRate = !!res.noRate;

    if (state.noRate) {
      $('rateNotice').classList.remove('hidden');
      $('rateNotice').textContent = 'Твоя ставка за 1 ЖК ще не заведена — сума порахується без неї. ' +
        'Звіт усе одно подавай, керівник це побачить.';
    }

    var box = $('metrics');
    state.fields.forEach(function (f) {
      var wrap = document.createElement('div');
      wrap.className = 'field';

      var lab = document.createElement('label');
      lab.appendChild(document.createTextNode(f.label));

      var tip = document.createElement('div');
      tip.className = 'tip';
      tip.appendChild(document.createTextNode(f.hint));
      if (f.per > 0) {
        tip.appendChild(document.createTextNode(' · '));
        var per = document.createElement('span');
        per.className = 'per';
        per.textContent = f.per + ' грн за кожен';
        tip.appendChild(per);
      }
      lab.appendChild(tip);

      var inp = document.createElement('input');
      inp.id = f.key;
      inp.type = 'text';
      inp.inputMode = 'numeric';
      inp.placeholder = '0';
      inp.addEventListener('input', function () { clearErr(f.key); recalc(); });

      var err = document.createElement('div');
      err.className = 'err';
      err.id = 'err_' + f.key;

      wrap.appendChild(lab); wrap.appendChild(inp); wrap.appendChild(err);
      box.appendChild(wrap);
    });

    var r = res.report;
    if (r) {
      $('editNotice').classList.remove('hidden');
      $('editNotice').textContent = 'Звіт за цей місяць уже є (оновлено ' + r.updated +
        '). Поля підставлені — зміни й надішли, старий буде перезаписаний.';
      state.fields.forEach(function (f) {
        if (r[f.key] !== undefined && r[f.key] !== null && r[f.key] !== '') $(f.key).value = r[f.key];
      });
      ['transport', 'other', 'comment'].forEach(function (k) {
        if (r[k] !== undefined && r[k] !== null && r[k] !== '') $(k).value = r[k];
      });
    }

    ['transport', 'other'].forEach(function (k) {
      $(k).addEventListener('input', function () { clearErr(k); recalc(); });
    });
    $('other').addEventListener('input', toggleComment);
    $('comment').addEventListener('input', function () { clearErr('comment'); });

    toggleComment();
    recalc();

    if (tg.MainButton) {
      tg.MainButton.setText('Надіслати звіт');
      tg.MainButton.onClick(submit);
      tg.MainButton.show();
    } else {
      show('fallbackSubmit');
      $('fallbackSubmit').onclick = submit;
    }
  }

  function toggleComment() {
    var v = parseFloat(String($('other').value).replace(',', '.'));
    if (v > 0) $('commentField').classList.remove('hidden');
    else { $('commentField').classList.add('hidden'); clearErr('comment'); }
  }

  /* ───────────────────── живий підрахунок суми ───────────────────── */

  function num(id) {
    var t = String($(id).value).trim().replace(/[\s ]/g, '').replace(',', '.');
    var n = parseFloat(t);
    return isNaN(n) || n < 0 ? 0 : n;
  }

  function recalc() {
    var sum = 0;
    state.fields.forEach(function (f) { sum += num(f.key) * (f.per || 0); });
    sum += num('transport') + num('other');

    var rounded = sum;
    if (state.roundUpTo > 0) rounded = Math.ceil(sum / state.roundUpTo) * state.roundUpTo;

    $('totalValue').textContent = money(rounded) + ' грн';
    var bits = [];
    if (rounded > sum) bits.push('округлено вгору з ' + money(sum));
    if (state.noRate) bits.push('без ставки за ЖК');
    $('totalHint').textContent = bits.join(' · ');
  }

  /* ─────────────────────────── валідація ─────────────────────────── */

  function setErr(id, msg) {
    $(id).classList.add('bad');
    $('err_' + id).textContent = msg;
    $('err_' + id).classList.add('on');
  }
  function clearErr(id) {
    $(id).classList.remove('bad');
    var e = $('err_' + id);
    if (e) e.classList.remove('on');
  }

  function readCount(id) {
    var t = String($(id).value).trim().replace(/[\s ]/g, '');
    if (t === '') return 0;                        // порожнє = нуль, не примушуємо
    if (!/^\d{1,5}$/.test(t)) { setErr(id, 'Тільки ціле число'); return null; }
    if (parseInt(t, 10) > 2000) { setErr(id, 'Забагато — перевір, чи не помилка'); return null; }
    return parseInt(t, 10);
  }
  function readMoney(id) {
    var t = String($(id).value).trim().replace(/[\s ]/g, '').replace(',', '.');
    if (t === '') return 0;
    if (!/^\d{1,7}(\.\d{1,2})?$/.test(t)) { setErr(id, 'Сума в гривнях, напр. 1450 або 1450.50'); return null; }
    var n = parseFloat(t);
    if (n > 200000) { setErr(id, 'Забагато — перевір, чи не помилка'); return null; }
    return n;
  }

  /* ───────────────────────── надсилання ───────────────────────── */

  var sending = false, busyRetries = 0, lastPayload = null;

  function submit() {
    if (sending) return;

    var v = {}, bad = false;
    state.fields.forEach(function (f) {
      var n = readCount(f.key);
      if (n === null) bad = true;
      v[f.key] = n;
    });
    var t = readMoney('transport'); if (t === null) bad = true;
    var o = readMoney('other');     if (o === null) bad = true;

    var comment = String($('comment').value).trim();
    if (!bad && o > 0 && comment.length < 3) {
      setErr('comment', 'Напиши кілька слів, на що пішли ці гроші');
      bad = true;
    }
    if (bad) {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      var firstBad = document.querySelector('.bad');
      if (firstBad) firstBad.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    v.transport = t; v.other = o; v.comment = comment;
    lastPayload = v;
    sendNow();
  }

  function sendNow() {
    sending = true;
    if (tg.MainButton) { tg.MainButton.showProgress(true); tg.MainButton.disable(); }
    else $('fallbackSubmit').disabled = true;

    api('submit', { payload: lastPayload }, function (res) {
      sending = false;
      if (tg.MainButton) { tg.MainButton.hideProgress(); tg.MainButton.enable(); }
      else $('fallbackSubmit').disabled = false;

      if (!res || !res.ok) {
        if (res && res.error === 'busy' && busyRetries < 2) {
          busyRetries++;
          if (tg.MainButton) tg.MainButton.showProgress(true);
          setTimeout(sendNow, 2500);
          return;
        }
        busyRetries = 0;
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        tg.showAlert((res && res.message) || 'Не вдалося зберегти. Спробуй ще раз.');
        return;
      }

      busyRetries = 0;
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      if (tg.MainButton) tg.MainButton.hide();
      hide('form'); hide('totalBar'); show('done');

      $('doneText').textContent = (res.updated ? 'Звіт за ' + res.label + ' оновлено.'
                                              : 'Звіт за ' + res.label + ' прийнято. Дякую!');
      var b = $('doneBreakdown');
      b.textContent = '';
      (res.breakdown || []).forEach(function (line) {
        var d = document.createElement('div');
        d.textContent = line;
        b.appendChild(d);
      });
      var tot = document.createElement('div');
      tot.style.cssText = 'margin-top:12px;font-size:19px;font-weight:700;color:var(--text)';
      tot.textContent = 'До виплати: ' + money(res.total) + ' грн';
      b.appendChild(tot);
    });
  }
})();
</script>
</body>
</html>
