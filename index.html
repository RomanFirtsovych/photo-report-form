<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Звіт фотографа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #16191d);
    --hint: var(--tg-theme-hint-color, #8b8f96);
    --section: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --btn: var(--tg-theme-button-color, #14b8a6);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);

    /* Фірмовий акцент — той самий мʼятний, що на аватарці бота. */
    --brand: #14b8a6;
    --brand-soft: rgba(20, 184, 166, .12);
    --danger: #e5484d;
    --danger-soft: rgba(229, 72, 77, .12);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --brand: #2dd4bf; --brand-soft: rgba(45, 212, 191, .16); }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; padding: 18px 16px 132px;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  h1 { font-size: 22px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--hint); font-size: 14px; margin-bottom: 18px; }

  .periodChip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--brand-soft); color: var(--brand);
    border-radius: 999px; padding: 6px 14px;
    font-size: 14px; font-weight: 600; margin-bottom: 20px;
  }

  .notice {
    border-radius: var(--radius); padding: 12px 14px;
    font-size: 14px; line-height: 1.4; margin-bottom: 16px;
    background: var(--section); color: var(--hint);
  }
  .notice.warn { background: var(--danger-soft); color: var(--danger); }

  /* ── поле ── */
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 15.5px; font-weight: 600; margin-bottom: 7px; }
  .tip { color: var(--hint); font-size: 13px; font-weight: 400; margin-top: 3px; line-height: 1.35; }
  .per { color: var(--brand); font-weight: 600; white-space: nowrap; }

  .inputWrap { position: relative; }
  input, textarea {
    width: 100%; padding: 13px 15px; font-size: 17px; font-family: inherit;
    color: var(--text); background: var(--section);
    border: 1.5px solid transparent; border-radius: 12px; outline: none;
    transition: border-color .15s, background .15s;
  }
  input:focus, textarea:focus { border-color: var(--brand); background: var(--bg); }
  input.bad, textarea.bad { border-color: var(--danger); }
  textarea { min-height: 80px; resize: vertical; }

  .lineSum {
    font-size: 13px; font-weight: 600; color: var(--brand);
    margin-top: 6px; min-height: 17px;
  }
  .err { color: var(--danger); font-size: 13px; margin-top: 6px; display: none; }
  .err.on { display: block; }

  /* ── група з перемикачем ── */
  .gate {
    background: var(--section); border-radius: var(--radius);
    padding: 14px 15px; margin-bottom: 14px;
  }
  .gate.open { background: var(--brand-soft); }
  .gate .q { font-size: 15.5px; font-weight: 600; line-height: 1.3; }
  .gate .h { color: var(--hint); font-size: 13px; margin-top: 3px; }
  .toggle {
    display: flex; gap: 6px; margin-top: 12px;
    background: var(--bg); border-radius: 11px; padding: 4px;
  }
  .toggle button {
    flex: 1; padding: 9px; font-size: 15.5px; font-weight: 600; font-family: inherit;
    color: var(--hint); background: transparent;
    border: none; border-radius: 8px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .toggle button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.10); }
  .toggle button.yes.on { background: var(--brand); color: #fff; box-shadow: none; }

  .groupBody { margin-bottom: 2px; }
  .groupBody.gated {
    padding: 6px 0 2px 14px; margin-bottom: 12px;
    border-left: 2px solid var(--brand-soft);
    animation: slide .18s ease-out;
  }
  @keyframes slide {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: none; }
  }

  .sectionLabel {
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--hint); font-weight: 700; margin: 26px 0 12px;
  }

  /* ── підсумок ── */
  .total {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--bg);
    border-top: 1px solid var(--section);
    padding: 13px 16px calc(13px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 20px rgba(0,0,0,.05);
  }
  .total .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .total .lbl { font-size: 14px; color: var(--hint); }
  .total .big {
    font-size: 26px; font-weight: 800; letter-spacing: -.02em;
    color: var(--brand); font-variant-numeric: tabular-nums;
  }
  .total .hintline { color: var(--hint); font-size: 12px; margin-top: 3px; }

  /* ── вибір себе ── */
  .name-list button {
    display: block; width: 100%; text-align: left; margin-bottom: 8px;
    padding: 15px; font-size: 17px; font-family: inherit;
    color: var(--text); background: var(--section);
    border: 1.5px solid transparent; border-radius: 12px; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .name-list button:active { border-color: var(--brand); background: var(--brand-soft); }
  #pickSearch { margin-bottom: 14px; }

  /* ── екрани ── */
  .center { text-align: center; padding: 64px 20px; color: var(--hint); }
  .big-emoji { font-size: 46px; margin-bottom: 14px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 16px;
    border: 3px solid var(--section); border-top-color: var(--brand);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .doneTitle { font-size: 17px; font-weight: 600; color: var(--text); }
  .doneCard {
    background: var(--section); border-radius: var(--radius);
    padding: 16px; margin-top: 18px; text-align: left;
  }
  .doneCard .line {
    display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
    padding: 7px 0;
  }
  .lineLeft { min-width: 0; }
  .lineLabel { font-size: 14.5px; color: var(--text); line-height: 1.3; }
  .lineDetail { font-size: 12.5px; color: var(--hint); margin-top: 1px; }
  .lineAmount {
    font-size: 14.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .doneTotal {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--bg);
    display: flex; justify-content: space-between; align-items: baseline;
    font-weight: 800; font-size: 20px; color: var(--brand);
  }
  .doneTotal .cap { font-size: 14px; font-weight: 600; color: var(--text); }

  .fallback {
    width: 100%; padding: 16px; margin-top: 10px; font-size: 17px; font-weight: 700;
    font-family: inherit; color: var(--btn-text); background: var(--brand);
    border: none; border-radius: 12px; cursor: pointer;
  }
  .fallback:disabled { opacity: .6; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="loading" class="center"><div class="spinner"></div>Завантаження…</div>

<div id="fatal" class="center hidden">
  <div class="big-emoji">⚠️</div>
  <div id="fatalText"></div>
</div>

<div id="pick" class="hidden">
  <h1>Хто ти?</h1>
  <div class="sub">Обери своє імʼя один раз — далі бот тебе впізнаватиме сам.</div>
  <input id="pickSearch" type="text" placeholder="Почни вводити прізвище…" autocomplete="off">
  <div id="pickList" class="name-list"></div>
  <div id="pickEmpty" class="notice hidden">
    Твого імені немає у списку вільних. Можливо, ти вже обрав себе раніше
    з іншого акаунта. Звернись до керівника.
  </div>
</div>

<div id="form" class="hidden">
  <h1>Місячний звіт</h1>
  <div class="sub" id="who"></div>
  <div class="periodChip" id="periodLine"></div>
  <div id="editNotice" class="notice hidden"></div>
  <div id="rateNotice" class="notice warn hidden"></div>

  <div id="metrics"></div>

  <div class="sectionLabel">Витрати</div>

  <div class="field">
    <label>Витрати на транспорт, грн<div class="tip">Напр. 1450 або 1450.50</div></label>
    <input id="transport" type="text" inputmode="decimal" placeholder="0">
    <div class="err" id="err_transport"></div>
  </div>

  <div class="gate">
    <div class="q">Чи були інші витрати?</div>
    <div class="h">Усе, крім транспорту</div>
    <div class="toggle" id="otherToggle">
      <button type="button" class="no" id="otherNo">Ні</button>
      <button type="button" class="yes" id="otherYes">Так</button>
    </div>
  </div>

  <div class="field hidden" id="otherField">
    <label>Сума інших витрат, грн<div class="tip">Напр. 35</div></label>
    <input id="other" type="text" inputmode="decimal" placeholder="0">
    <div class="err" id="err_other"></div>
  </div>

  <div class="field hidden" id="commentField">
    <label>На що були інші витрати<div class="tip">Коротко, кілька слів</div></label>
    <textarea id="comment" placeholder="Напр. корм"></textarea>
    <div class="err" id="err_comment"></div>
  </div>

  <button id="fallbackSubmit" class="fallback hidden">Надіслати звіт</button>
</div>

<div id="totalBar" class="total hidden">
  <div class="row">
    <span class="lbl">Разом до виплати</span>
    <span class="big" id="totalValue">0 грн</span>
  </div>
  <div class="hintline" id="totalHint"></div>
</div>

<div id="done" class="center hidden">
  <div class="big-emoji">✅</div>
  <div id="doneText" class="doneTitle"></div>
  <div class="doneCard" id="doneBreakdown"></div>
</div>

<script>
(function () {
  'use strict';

  // ⚠️ Встав сюди URL веб-апки Apps Script (закінчується на /exec)
  var API = 'https://script.google.com/macros/s/AKfycbxEknWI_qIV0jROjU8lL_6IiFdH6ejn_3Ae8PGbNY-HkE7fa2-GchtEKWmYpphss12q/exec';

  var tg = window.Telegram && window.Telegram.WebApp;
  var state = { fields: [], groups: [], open: {}, gates: {}, otherOpen: false, roundUpTo: 0, noRate: false };

  var $ = function (id) { return document.getElementById(id); };
  var show = function (id) { $(id).classList.remove('hidden'); };
  var hide = function (id) { $(id).classList.add('hidden'); };
  var money = function (v) {
    var n = Math.round((Number(v) || 0) * 100) / 100;
    return (n % 1 === 0 ? String(n) : n.toFixed(2));
  };

  if (!tg || !tg.initData) {
    hide('loading'); show('fatal');
    $('fatalText').textContent = 'Цю форму треба відкривати з Telegram — через кнопку в робочому чаті.';
    return;
  }
  tg.ready();
  tg.expand();

  function fail(msg) {
    hide('loading'); hide('form'); hide('totalBar');
    show('fatal');
    $('fatalText').textContent = msg;
  }

  function api(action, extra, cb) {
    var body = { __miniapp: 1, action: action, initData: tg.initData };
    for (var k in extra) if (extra.hasOwnProperty(k)) body[k] = extra[k];

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        // Помилку в самому обробнику не можна плутати з мережевою:
        // інакше баг у формі виглядає як «немає інтернету».
        try { cb(data); }
        catch (e) { fail('Помилка у формі: ' + (e && e.message ? e.message : e)); throw e; }
      })
      .catch(function (e) {
        if (!$('fatal').classList.contains('hidden')) return;   // вже показали причину
        fail('Немає звʼязку з сервером. Перевір інтернет і спробуй ще раз.');
      });
  }

  api('init', {}, function (res) {
    hide('loading');
    if (!res || !res.ok) {
      show('fatal');
      $('fatalText').textContent = (res && res.message) || 'Не вдалося завантажити форму.';
      return;
    }
    if (!res.bound) { renderPick(res.candidates || []); return; }
    startForm(res);
  });

  /* ────────────────────── вибір себе зі списку ────────────────────── */

  function renderPick(list) {
    show('pick');
    if (!list.length) { hide('pickSearch'); show('pickEmpty'); return; }

    var box = $('pickList');
    $('pickSearch').addEventListener('input', function () {
      var q = this.value.trim().toLowerCase();
      for (var i = 0; i < box.children.length; i++) {
        var el = box.children[i];
        el.style.display = (!q || el.textContent.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
      }
    });

    list.forEach(function (p) {
      var b = document.createElement('button');
      b.appendChild(document.createTextNode(p.name));
      b.onclick = function () {
        b.disabled = true;
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        api('bind', { userId: p.userId }, function (r) {
          if (!r || !r.ok) {
            b.disabled = false;
            tg.showAlert((r && r.message) || 'Не вдалося привʼязати.');
            return;
          }
          hide('pick'); show('loading');
          api('init', {}, function (r2) {
            hide('loading');
            if (r2 && r2.ok && r2.bound) startForm(r2);
            else { show('fatal'); $('fatalText').textContent = 'Привʼязано, але форма не завантажилась. Відкрий заново.'; }
          });
        });
      };
      box.appendChild(b);
    });
  }

  /* ──────────────────────────── форма ──────────────────────────── */

  function startForm(res) {
    show('form');
    show('totalBar');
    $('who').textContent = res.name;
    $('periodLine').textContent = 'Звіт за ' + res.period.label;
    state.fields = res.fields || [];
    state.roundUpTo = res.roundUpTo || 0;
    state.noRate = !!res.noRate;

    if (state.noRate) {
      $('rateNotice').classList.remove('hidden');
      $('rateNotice').textContent = 'Твоя ставка за 1 ЖК ще не заведена — сума порахується без неї. ' +
        'Звіт усе одно подавай, керівник це побачить.';
    }

    var box = $('metrics');
    state.groups = res.groups || [{ key: 'main', gate: null }];

    var r = res.report;

    state.groups.forEach(function (g) {
      var mine = state.fields.filter(function (f) { return f.group === g.key; });
      if (!mine.length) return;

      var body = document.createElement('div');
      body.className = 'groupBody';
      body.id = 'group_' + g.key;

      mine.forEach(function (f) { body.appendChild(buildField(f)); });

      if (!g.gate) { box.appendChild(body); return; }
      body.className = 'groupBody gated';

      // Група з питанням «чи було?» — деталі ховаємо, поки не «Так».
      var gate = document.createElement('div');
      gate.className = 'gate';

      var q = document.createElement('div');
      q.className = 'q';
      q.textContent = g.gate;
      gate.appendChild(q);

      if (g.hint) {
        var h = document.createElement('div');
        h.className = 'h';
        h.textContent = g.hint;
        gate.appendChild(h);
      }

      var tg2 = document.createElement('div');
      tg2.className = 'toggle';
      var bNo = document.createElement('button');
      bNo.type = 'button'; bNo.className = 'no'; bNo.textContent = 'Ні';
      var bYes = document.createElement('button');
      bYes.type = 'button'; bYes.className = 'yes'; bYes.textContent = 'Так';
      tg2.appendChild(bNo); tg2.appendChild(bYes);
      gate.appendChild(tg2);

      box.appendChild(gate);
      box.appendChild(body);

      var setOpen = function (open) {
        state.open[g.key] = open;
        gate.classList.toggle('open', open);
        bYes.classList.toggle('on', open);
        bNo.classList.toggle('on', !open);
        body.classList.toggle('hidden', !open);
        if (!open) {
          // Закрили — значить нічого не було. Чистимо, щоб не тягнути
          // випадково введені числа у підсумок.
          mine.forEach(function (f) { $(f.key).value = ''; clearErr(f.key); });
        }
        recalc();
      };

      bYes.onclick = function () { setOpen(true); };
      bNo.onclick = function () { setOpen(false); };
      setOpen(false);
      state.gates[g.key] = setOpen;
    });

    if (r) {
      $('editNotice').classList.remove('hidden');
      $('editNotice').textContent = 'Звіт за цей місяць уже є (оновлено ' + r.updated +
        '). Поля підставлені — зміни й надішли, старий буде перезаписаний.';
      // Відкриваємо групи, в яких минулого разу були ненульові значення.
      state.groups.forEach(function (g) {
        if (!g.gate) return;
        var any = state.fields.some(function (f) {
          return f.group === g.key && Number(r[f.key]) > 0;
        });
        if (any && state.gates[g.key]) state.gates[g.key](true);
      });
      state.fields.forEach(function (f) {
        var v = r[f.key];
        if (v !== undefined && v !== null && v !== '' && Number(v) !== 0) $(f.key).value = v;
      });
      ['transport', 'other', 'comment'].forEach(function (k) {
        var v = r[k];
        if (v !== undefined && v !== null && v !== '' && v !== 0) $(k).value = v;
      });
    }

    ['transport', 'other'].forEach(function (k) {
      $(k).addEventListener('input', function () { clearErr(k); recalc(); });
    });
    $('comment').addEventListener('input', function () { clearErr('comment'); });

    var setOther = function (open) {
      state.otherOpen = open;
      $('otherYes').classList.toggle('on', open);
      $('otherNo').classList.toggle('on', !open);
      $('otherField').classList.toggle('hidden', !open);
      $('commentField').classList.toggle('hidden', !open);
      if (!open) {
        $('other').value = ''; $('comment').value = '';
        clearErr('other'); clearErr('comment');
      }
      recalc();
    };
    $('otherYes').onclick = function () { setOther(true); };
    $('otherNo').onclick = function () { setOther(false); };
    state.setOther = setOther;
    setOther(Number(r && r.other) > 0);

    recalc();

    if (tg.MainButton) {
      tg.MainButton.setText('Надіслати звіт');
      tg.MainButton.onClick(submit);
      tg.MainButton.show();
    } else {
      show('fallbackSubmit');
      $('fallbackSubmit').onclick = submit;
    }
  }

  function buildField(f) {
    var wrap = document.createElement('div');
    wrap.className = 'field';

    var lab = document.createElement('label');
    lab.appendChild(document.createTextNode(f.label));

    var tip = document.createElement('div');
    tip.className = 'tip';
    if (f.hint) tip.appendChild(document.createTextNode(f.hint));
    if (f.per > 0) {
      if (f.hint) tip.appendChild(document.createTextNode(' · '));
      var per = document.createElement('span');
      per.className = 'per';
      per.textContent = f.per + ' грн за кожен';
      tip.appendChild(per);
    }
    lab.appendChild(tip);

    var inp = document.createElement('input');
    inp.id = f.key;
    inp.type = 'text';
    inp.inputMode = 'numeric';
    inp.placeholder = '0';
    inp.addEventListener('input', function () { clearErr(f.key); recalc(); });

    var sum = document.createElement('div');
    sum.className = 'lineSum';
    sum.id = 'sum_' + f.key;

    var err = document.createElement('div');
    err.className = 'err';
    err.id = 'err_' + f.key;

    wrap.appendChild(lab); wrap.appendChild(inp); wrap.appendChild(sum); wrap.appendChild(err);
    return wrap;
  }

  /* ───────────────────── живий підрахунок суми ───────────────────── */

  /** Число з поля, без валідації: для живого підрахунку сміття = 0. */
  function num(id) {
    var el = $(id);
    if (!el) return 0;
    var t = String(el.value).trim().replace(/[\s ]/g, '').replace(',', '.');
    var n = parseFloat(t);
    return isNaN(n) || n < 0 ? 0 : n;
  }

  /** Поле рахується, лише якщо його група відкрита (або не має перемикача). */
  function isFieldActive(f) {
    for (var i = 0; i < state.groups.length; i++) {
      if (state.groups[i].key === f.group) {
        return !state.groups[i].gate || !!state.open[f.group];
      }
    }
    return true;
  }

  function recalc() {
    var sum = 0;
    state.fields.forEach(function (f) {
      var line = $('sum_' + f.key);
      if (!isFieldActive(f)) { if (line) line.textContent = ''; return; }
      var n = num(f.key);
      var s2 = n * (f.per || 0);
      sum += s2;
      if (line) line.textContent = (n > 0 && f.per > 0) ? ('= ' + money(s2) + ' грн') : '';
    });
    sum += num('transport') + (state.otherOpen ? num('other') : 0);

    var rounded = sum;
    if (state.roundUpTo > 0) rounded = Math.ceil(sum / state.roundUpTo) * state.roundUpTo;

    $('totalValue').textContent = money(rounded) + ' грн';
    var bits = [];
    if (rounded > sum) bits.push('округлено вгору з ' + money(sum));
    if (state.noRate) bits.push('без ставки за ЖК');
    $('totalHint').textContent = bits.join(' · ');
  }

  /* ─────────────────────────── валідація ─────────────────────────── */

  function setErr(id, msg) {
    $(id).classList.add('bad');
    $('err_' + id).textContent = msg;
    $('err_' + id).classList.add('on');
  }
  function clearErr(id) {
    $(id).classList.remove('bad');
    var e = $('err_' + id);
    if (e) e.classList.remove('on');
  }

  function readCount(id) {
    var t = String($(id).value).trim().replace(/[\s ]/g, '');
    if (t === '') return 0;                        // порожнє = нуль, не примушуємо
    if (!/^\d{1,5}$/.test(t)) { setErr(id, 'Тільки ціле число'); return null; }
    if (parseInt(t, 10) > 2000) { setErr(id, 'Забагато — перевір, чи не помилка'); return null; }
    return parseInt(t, 10);
  }
  function readMoney(id) {
    var t = String($(id).value).trim().replace(/[\s ]/g, '').replace(',', '.');
    if (t === '') return 0;
    if (!/^\d{1,7}(\.\d{1,2})?$/.test(t)) { setErr(id, 'Сума в гривнях, напр. 1450 або 1450.50'); return null; }
    var n = parseFloat(t);
    if (n > 200000) { setErr(id, 'Забагато — перевір, чи не помилка'); return null; }
    return n;
  }

  /* ───────────────────────── надсилання ───────────────────────── */

  var sending = false, busyRetries = 0, lastPayload = null;

  function submit() {
    if (sending) return;

    var v = {}, bad = false;
    state.fields.forEach(function (f) {
      if (!isFieldActive(f)) { v[f.key] = 0; return; }   // група закрита = нуль
      var n = readCount(f.key);
      if (n === null) bad = true;
      v[f.key] = n;
    });
    var t = readMoney('transport'); if (t === null) bad = true;
    var o = state.otherOpen ? readMoney('other') : 0;
    if (o === null) bad = true;

    var comment = state.otherOpen ? String($('comment').value).trim() : '';
    if (!bad && o > 0 && comment.length < 3) {
      setErr('comment', 'Напиши кілька слів, на що пішли ці гроші');
      bad = true;
    }
    if (bad) {
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      var firstBad = document.querySelector('.bad');
      if (firstBad) firstBad.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    v.transport = t; v.other = o; v.comment = comment;
    lastPayload = v;
    sendNow();
  }

  function sendNow() {
    sending = true;
    if (tg.MainButton) { tg.MainButton.showProgress(true); tg.MainButton.disable(); }
    else $('fallbackSubmit').disabled = true;

    api('submit', { payload: lastPayload }, function (res) {
      sending = false;
      if (tg.MainButton) { tg.MainButton.hideProgress(); tg.MainButton.enable(); }
      else $('fallbackSubmit').disabled = false;

      if (!res || !res.ok) {
        if (res && res.error === 'busy' && busyRetries < 2) {
          busyRetries++;
          if (tg.MainButton) tg.MainButton.showProgress(true);
          setTimeout(sendNow, 2500);
          return;
        }
        busyRetries = 0;
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        tg.showAlert((res && res.message) || 'Не вдалося зберегти. Спробуй ще раз.');
        return;
      }

      busyRetries = 0;
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      if (tg.MainButton) tg.MainButton.hide();
      hide('form'); hide('totalBar'); show('done');

      $('doneText').textContent = (res.updated ? 'Звіт за ' + res.label + ' оновлено.'
                                              : 'Звіт за ' + res.label + ' прийнято. Дякую!');
      var b = $('doneBreakdown');
      b.textContent = '';

      (res.lines || []).forEach(function (l) {
        var row = document.createElement('div');
        row.className = 'line';

        var left = document.createElement('div');
        left.className = 'lineLeft';
        var t1 = document.createElement('div');
        t1.className = 'lineLabel';
        t1.textContent = l.label;
        left.appendChild(t1);
        if (l.detail) {
          var t2 = document.createElement('div');
          t2.className = 'lineDetail';
          t2.textContent = l.detail;
          left.appendChild(t2);
        }

        var right = document.createElement('div');
        right.className = 'lineAmount';
        right.textContent = (l.amount === null || l.amount === undefined)
          ? '' : money(l.amount) + ' грн';

        row.appendChild(left); row.appendChild(right);
        b.appendChild(row);
      });

      var tot = document.createElement('div');
      tot.className = 'doneTotal';
      var cap = document.createElement('span');
      cap.className = 'cap';
      cap.textContent = 'До виплати';
      var val = document.createElement('span');
      val.textContent = money(res.total) + ' грн';
      tot.appendChild(cap); tot.appendChild(val);
      b.appendChild(tot);
    });
  }
})();
</script>
</body>
</html>
